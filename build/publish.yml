stages:
 - stage: 'Publish'
   dependsOn: 'Build'
   condition: and(succeeded(), eq(variables.IsMainBranch, true))
   jobs:
    - job: 'Publish'
      displayName: 'Publish to Powershell Gallery'
      templateContext:
        type: releaseJob 
        isProduction: true
        inputs:
          - input: pipelineArtifact
            artifactName: dropModule
            targetPath: $(Pipeline.Workspace)/dropModule
    
      pool: '$(MicroBuildPool)'

      variables:
        - group: 'VSSetup secrets'

      steps:
      - checkout: none  

      - pwsh: |
          $ErrorActionPreference = 'Stop'

          $manifest = Test-ModuleManifest -Path "$(Pipeline.Workspace)\dropModule\Microsoft.VisualStudio.DSC\Microsoft.VisualStudio.DSC.psd1"

          $prerelease = $manifest.PrivateData.PSData.Prerelease
          $isPreRelease = -not [string]::IsNullOrEmpty($prerelease)

          $publishVersion = $manifest.Version.ToString()
          if ($isPreRelease) {
              $publishVersion = "$publishVersion-$prerelease"
          }

          Write-Host "Module version to publish: $publishVersion (pre-release: $isPreRelease)"
          Write-Host "##vso[task.setvariable variable=isPublishPreRelease;]$isPreRelease"
          Write-Host "##vso[task.setvariable variable=publishVersion;]$publishVersion"
        displayName: 'Determining module version and Pre Release state'

      # PSResourceGet is the module we need, so the bootstrap has to use in-box PowerShellGet.
      # Pattern is 1ES SFI guidance: https://aka.ms/1es/netiso/CFS
      - task: NuGetAuthenticate@1
        displayName: 'Authenticate to Azure Artifacts'

      - pwsh: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'PSResourceGet already present on the image:'
          Get-Module -ListAvailable Microsoft.PowerShell.PSResourceGet | Select-Object Name, Version | Format-Table

          $token = $env:SYSTEM_ACCESSTOKEN | ConvertTo-SecureString -AsPlainText -Force
          $credential = [pscredential]::new('username', $token)

          Register-PSRepository -Name '$(InternalFeedName)' `
              -SourceLocation '$(InternalFeedV2Uri)' `
              -InstallationPolicy Trusted `
              -Credential $credential

          Get-PSRepository

          Install-Module -Name Microsoft.PowerShell.PSResourceGet -RequiredVersion '$(PSResourceGetVersion)' `
              -Repository '$(InternalFeedName)' -Credential $credential -Force

          Get-Module -ListAvailable Microsoft.PowerShell.PSResourceGet | Select-Object Name, Version | Format-Table
        displayName: 'Install PSResourceGet from the internal feed'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - pwsh: |
          $ErrorActionPreference = 'Stop'

          Import-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion '$(PSResourceGetVersion)'

          # Publish-PSResource reads the repository store while binding parameters, which throws on a
          # fresh agent where the store has never been created. Touching it first creates the default.
          # See https://github.com/PowerShell/PSResourceGet/issues/1806
          Get-PSResourceRepository | Out-Null

          # Pack locally rather than letting the upload do it, so the same file we ship to the Gallery
          # is the one attached to the GitHub release. Saves downloading it back off the Gallery CDN,
          # which is the only dependency-shaped Gallery access this pipeline had.
          $stagingPath = "$(Build.ArtifactStagingDirectory)"
          New-Item -Path $stagingPath -ItemType Directory -Force | Out-Null

          Register-PSResourceRepository -Name 'LocalOutput' -Uri $stagingPath -Trusted -Force

          Publish-PSResource `
              -Path "$(Pipeline.Workspace)\dropModule\Microsoft.VisualStudio.DSC" `
              -Repository 'LocalOutput' `
              -Verbose `
              -Confirm:$false

          # Publish-PSResource names the package after the manifest, so this is the exact file the
          # version step resolved. Asserting on the name catches a manifest/version mismatch here
          # rather than after it has already gone to the Gallery.
          $nupkgPath = Join-Path $stagingPath "Microsoft.VisualStudio.DSC.$(publishVersion).nupkg"

          if (-not (Test-Path -Path $nupkgPath)) {
              $found = (Get-ChildItem -Path $stagingPath -Filter '*.nupkg' -File).Name -join ', '
              throw "Expected Publish-PSResource to produce '$nupkgPath' but it is not there. Found: $found"
          }

          Write-Host "Packed $nupkgPath"
          Write-Host "##vso[task.setvariable variable=nupkgPath;]$nupkgPath"
        displayName: 'Packing module into a nupkg'

      - pwsh: |
          $ErrorActionPreference = 'Stop'

          Import-Module Microsoft.PowerShell.PSResourceGet -RequiredVersion '$(PSResourceGetVersion)'

          # Gallery packages are immutable, so re-running this stage after the upload already landed
          # fails the whole release with a 409. Only the OData entity endpoint reports this honestly -
          # the /package/{id}/{version} route answers 200 for versions that don't exist.
          $versionUri = "https://www.powershellgallery.com/api/v2/Packages(Id='Microsoft.VisualStudio.DSC',Version='$(publishVersion)')"
          $existing = Invoke-WebRequest -Uri $versionUri -SkipHttpErrorCheck -ErrorAction SilentlyContinue

          if ($existing.StatusCode -eq 200) {
              Write-Host "##vso[task.logissue type=warning]$(publishVersion) is already on the PowerShell Gallery, skipping upload so the rest of the release can finish."
          }
          else {
              Publish-PSResource `
                  -NupkgPath "$(nupkgPath)" `
                  -Repository 'PSGallery' `
                  -ApiKey "$(VSSetup-Powershell-API-Key)" `
                  -Verbose `
                  -Confirm:$false
          }
        displayName: 'Upload module to PowerShell Gallery'

      - task: GitHubRelease@1
        displayName: 'Publish Release on GitHub'
        inputs:
          gitHubConnection: 'GitHub-Preecington'
          repositoryName: 'Microsoft/VisualStudioDSC'
          # 'edit' updates the release when the tag already has one and falls back to creating it
          # when it doesn't. 'create' throws a 422 for a tag that has already been released, which
          # would strand a re-run on the last step even once the Gallery steps are re-runnable.
          action: edit
          target: '$(Build.SourceVersion)'
          tag: '$(Build.BuildNumber)'
          assets: '$(Build.ArtifactStagingDirectory)\*.nupkg'
          # Drop the existing assets before uploading so the release always carries the nupkg
          # produced by the run that last touched it.
          assetUploadMode: delete
          isPreRelease: $(isPublishPreRelease)

