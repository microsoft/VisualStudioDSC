variables:
  - name: 'TeamName'
    value: 'VSSetup'

  - name: 'MicroBuildPool'
    value: 'VSEngSS-MicroBuild2022-1ES'

  - name: 'ModuleFolder'
    value: '$(Build.SourcesDirectory)'

  - name: 'ModuleSourceFolder'
    value: '$(ModuleFolder)\Microsoft.VisualStudio.DSC'

  - name: 'ModuleBuildFolder'
    value: '$(ModuleFolder)\build'

  # Pinned so a bad PSGallery release can't take the pipeline down the way 1.1.1 did.
  # See https://github.com/PowerShell/PSResourceGet/issues/1806
  - name: 'PSResourceGetVersion'
    value: '1.2.0'

  # Org-scoped Azure Artifacts feed backing all package acquisition. The v3 URL lives in
  # nuget.config at the repo root; PowerShellGet needs the v2 endpoint instead.
  - name: 'InternalFeedName'
    value: 'Setup-Dependencies'

  - name: 'InternalFeedV2Uri'
    value: 'https://pkgs.dev.azure.com/devdiv/_packaging/Setup-Dependencies/nuget/v2'
