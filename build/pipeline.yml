trigger:
  batch: true
  branches:
    include:
    - main
  paths:
    exclude:
    - '*.md'

pr: none

variables:
  - template: 'variables.yml'
  
  - name: 'IsMainBranch'
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

  - name: 'SignType'
    value: 'real' # Always needs to real sign for CI pipeline, refactoring needed for PRs: https://task.ms/dd/2507602

parameters:
  - name: LogBugs
    displayName: Log bugs?
    type: boolean
    default: true

resources:
  repositories:
    - repository: MicroBuildTemplate
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    settings:
      # CFSClean2 is deliberately omitted. It blocks the PowerShell Gallery, and the Publish stage
      # has to reach it to ship the module. 1ES guidance for that case is to request an S360
      # exception of type 'Dispute' rather than allow-list the endpoint.
      # See https://aka.ms/1es/netiso/CFS
      networkIsolationPolicy: Permissive,CFSClean
    pool:
      name: VSEngSS-MicroBuild2022-1ES
    sdl:
      policheck:
        enabled: true
      binskim:
        enabled: true
        scanOutputDirectoryOnly: true
      tsa:
        enable: ${{ parameters.LogBugs }}
        configFile: $(Build.SourcesDirectory)\.config\tsaoptions.json
        onboard: false # We already onboarded

    stages:
      - template: 'build.yml'
        parameters:
          SignType: 'real'
      - template: 'publish.yml'
